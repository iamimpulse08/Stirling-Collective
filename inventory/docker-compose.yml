version: "3.8"

services:
  db:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
  inventory:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "8080:8080"