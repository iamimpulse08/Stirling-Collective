    function buildTable(columns, rows) {
        const table = document.createElement("table");
        table.setAttribute("border", "1");

        const headerRow = table.insertRow();

        columns.forEach(column => {
            const headerCell = headerRow.insertCell();
            headerCell.textContent = column.label;
        });

        rows.forEach(row => {
            const dataRow = table.insertRow();
            columns.forEach(column => {
                dataRow.insertCell().textContent = column.accessor(row);
            });
        });

        return table;
    }

    async function addProduct() {
        let URL = applicationRoot + `api/` + `products`;
        const output = document.getElementById("output");

        await fetch(URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                name: "Test Product",
                price: 100,
                quantity: 10,
                category: "Test Category"
            })
        })
    }

    async function getAllProducts() {
        let URL = applicationRoot + `api/` + `products`;
        const output = document.getElementById("output");

        await fetch(URL)
            .then(response => response.json())
        .then(data => {
            console.log(data);

            const productColumns = [

                { label: 'ID', accessor: p => p.id },
                { label: 'Name', accessor: p => p.name },
                { label: 'Price', accessor: p => p.price },
                { label: 'Quantity', accessor: p => p.quantity },
                { label: 'Category', accessor: p => p.category},
            ];


            output.innerHTML = ''
            output.appendChild(buildTable(productColumns, data._embeddedd.productList));
        });
    }
